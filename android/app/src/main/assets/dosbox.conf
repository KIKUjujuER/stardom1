# DOSBox configuration for Android (whereq-dosbox)
#
# Copied into the app's private files directory on first start and then used
# as the primary configuration (the activity passes "-conf dosbox.conf").
#
# The working directory is the app's files directory (see
# android/jni/dosbox_android.cpp), so relative paths below resolve inside
# the app sandbox.

[sdl]
# The SDL window on Android is always the full screen SurfaceView, so the
# picture has to be scaled by the renderer:
#   output=texture  -> SCREEN_TEXTURE path (SDL_RenderCopy), which scales the
#                      texture into sdl.clip instead of blitting 1:1
#   fullscreen=true + fullresolution=desktop
#                   -> DOSBox computes the aspect-corrected clip for the
#                      current display size and centers it (letterbox)
#   aspect=true     -> the 640x400 DOS picture is corrected to 4:3
#
# renderer is left at "auto": on Android SDL picks its GLES2 renderer, which
# presents with eglSwapBuffers() straight to the SurfaceView. The software
# renderer does not work here, because its SDL_UpdateWindowSurface() needs
# SDL's texture framebuffer on the window - and that framebuffer owns a
# renderer of its own, which conflicts with the renderer of the texture path.
output=texture
fullscreen=true
fullresolution=desktop
# Touch input must not grab the mouse.
autolock=false
waitonerror=false

[dosbox]
memsize=16
nosound=false
# No physical CD-ROM on Android; use IMGMOUNT for CD images.
machine=svga_s3

[mixer]
# Audio smoothing for a phone. The defaults (44100 / blocksize 1024 /
# prebuffer 25 ms) are tuned for a desktop; on a phone the extra, steady CPU
# load of OPL/FM music makes the mixer's rate-tracking feedback loop hunt,
# which pitch-modulates a sustained FM note into an audible warble ("a beep
# that is only there while the BGM plays"). Transient digital SFX are too
# short to reveal it, so they stay clean.
#
#   rate=48000     - the native rate of most modern phones, so the OS does not
#                    quietly resample 44100 under SDL (another source of a beat
#                    tone against a held FM note).
#   blocksize=2048 - fewer, larger audio callbacks -> steadier cadence.
#   prebuffer=50   - a deeper cushion (ms) so a momentary stall is absorbed
#                    instead of forcing the rate-nudge that bends the pitch.
#
# This only changes audio buffering, never game speed or logic. Latency rises
# by ~50 ms, which is inaudible for a DOS game.
rate=48000
blocksize=2048
prebuffer=50

[cpu]
# core=auto uses the recompiling (JIT) core for protected-mode code and the
# interpreter for real-mode, switching as programs change mode — the standard
# upstream default. The portable recompiler (C_DYNREC) is built in for all
# Android ABIs: aarch64 (risc_armv8le), armv7 (risc_armv4le) and the x86_64
# emulator (risc_x64). Its code cache is an anonymous RWX mmap (see the
# __ANDROID__ branch in src/cpu/core_dynrec/cache.h), because Android forbids
# making malloc'd heap executable.
#
# What that means in practice:
#
#   * A real-mode program (a plain .COM or .EXE, like STARFALL) runs on the
#     interpreter either way — the JIT never switches on, and the code cache
#     is not even allocated.
#   * A protected-mode program (a DOS/4GW extender, e.g. Ultima VIII, and
#     many of the Chinese DOS games) runs on the recompiler, which is
#     several times faster than the interpreter.
#
# The cache is allocated on the first switch into protected mode. If that
# allocation were ever refused, DOSBox would exit with "Allocating dynamic
# cache failed" instead of falling back to the interpreter; set core=normal
# if a device ever misbehaves that way.
core=dynamic
# A higher starting budget keeps real-mode games responsive; protected-mode games still switch to the JIT core.
cycles=auto 25000 65% limit 200000
cputype=auto
cycleup=20
cycledown=20

[render]
scaler=none
aspect=true

[autoexec]
# Make the app's files directory available as C: and switch to it, so the
# user lands on a C:\> prompt.
mount c .
c:
